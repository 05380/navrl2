defaults:
  - _self_
  - drone
  - ppo
  - sim

headless: False
device: "cuda:0"
seed: 0
checkpoint:

# Total Training Length
max_frame_num: 14e8 # max frame 
eval_interval: 1000 # evaluate the policy for every N training steps
save_interval: 1000

# Training Environment
env:
  num_envs: 2 # Number of drones for training
  max_episode_length: 2200
  env_spacing: 8.0 
  num_obstacles: 350
  wall_style: 0 # 0: original map, 1-2: single walls, 3-4: L walls, 5-6: U walls
  wall:
    length_range: [4.0, 8.0]
    l_length_range: [3.5, 6.5]
    u_width_range: [4.0, 7.0]
    u_depth_range: [3.5, 6.5]
    thickness_range: [0.35, 0.65]
    height_range: [2.0, 4.0, 6.0]
    height_probability: [0.10, 0.90]
    placement_margin: 4.0
    min_separation: 4.0
    obstacle_clearance: 0.4
    sampling_attempts: 200
    spawn_clearance_radius: 1.5
    target_clearance_radius: 1.5
    position_sample_attempts: 128

env_dyn:
  num_obstacles: 80 # set to zero if static env is needed
  vel_range: [0.5, 1.5]
  local_range: [5.0, 5.0, 4.5]

stuck:
  window: 40
  progress_eps: 0.005
  front_obstacle_distance: 1.5
  front_angle_deg: 35.0
  front_height: 0.75 #

reward:
  goal_progress:
    goal_radius: 0.5
    arrival_reward: 45.0
    timeout_penalty: 30.0
    progress_scale: 35.0
  stall:
    weight: 0.5
    window: 60
    ramp_window: 60
    distance_threshold: 0.25
    speed_threshold: 0.15
    progress_eps: 0.005
  vo:
    weight: 1.3
    tau: 0.75
    horizon: 2.5
    xy_margin: 0.3
    z_margin: 0.3
    reward_topk: 10
    warmup_steps: 20000

viewer:
  eye: [0., 40., 40.]
  lookat: [0., 2.5, 0.]
  resolution: [960, 720]

wandb:
  project: NavRL
  name: navigation_training
  entity: CERLAB-UAV-RL-Navigation
  mode: offline # online
  run_id: #kw9xf9k9
