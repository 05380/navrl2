defaults:
  - _self_
  - drone
  - ppo
  - sim

headless: False
device: "cuda:0"
seed: 0
checkpoint:
eval_style: random_crossing_eval # random_crossing_eval or standard_eval
train_style: random_crossing_eval # random_crossing_eval keeps target off the start side; random samples start and target independently

# Total Training Length
max_frame_num: 14e8 # max frame 
eval_interval: 1000 # evaluate the policy for every N training steps
save_interval: 1000

# Training Environment
env:
  num_envs: 2 # Number of drones for training
  max_episode_length: 2200
  env_spacing: 8.0 
  num_obstacles: 350
  wall_style: 0 # 0: original, 1: 1 single, 2: 2 singles, 3: 3 singles, 4: 2 singles+1 L, 5: 3 singles+1 L, 6: 2 singles+1 L+1 U, 7: 2 singles+1 L+2 U
  wall:
    length_range: [5.0, 7.0, 10.0, 12.0]
    length_probability: [0.10, 0.10, 0.80]
    l_length_range: [8.0, 10.0]
    u_width_range: [10.0, 12.0]
    u_depth_range: [3.5, 6.5]
    thickness_range: [0.35, 0.65]
    height_range: [2.0, 4.0, 6.0]
    height_probability: [0.0, 1.0]
    placement_margin: 4.0
    min_separation: 4.0
    obstacle_clearance: 0.4
    sampling_attempts: 500
    spawn_clearance_radius: 1.5
    target_clearance_radius: 1.5
    position_sample_attempts: 128

env_dyn:
  num_obstacles: 80 # set to zero if static env is needed
  vel_range: [0.5, 1.5]
  local_range: [5.0, 5.0, 4.5]

observation_noise:
  enabled: true
  train_only: true
  observation_delay:
    steps: 0
  action_delay:
    steps: 0
  action_execution:
    std: 0.03
    scale_std: 0.03
  lidar:
    std: 0 #0.03
    dropout_prob: 0 #0.03
    scale_std: 0 #0.02
    quantization: 0 #0.10
  dynamic_obstacle:
    position_std: 0 #0.10
    velocity_std: 0 #0.10
    size_std: 0 #0.05
    dropout_prob: 0 #0.10
    frame_dropout_prob: 0 #0.05

stuck:
  window: 60
  progress_eps: 0.005
  front_obstacle_distance: 1.5
  front_angle_deg: 30.0
  front_height: 0.75 #

reward:
  goal_progress:
    goal_radius: 0.5
    arrival_reward: 50.0
    timeout_penalty: 45.0
    progress_scale: 35.0
    blocked_backward_scale: 0.1
  escape:
    weight: 3.0
  stall:
    weight: 1.0
    window: 60
    ramp_window: 60
    distance_threshold: 0.25
    speed_threshold: 0.15
    progress_eps: 0.005
  vo:
    weight: 1.3
    tau: 0.75
    horizon: 2.1
    xy_margin: 0.3
    z_margin: 0.3
    action_weight: 0.5
    static_weight: 0.6
    safe_action_weight: 0.15
    static_radius: 0.0
    static_vertical_min: -0.35
    reward_topk: 10
    sphere_stack: true
    sphere_stack_max_spheres: 0 # 0 keeps the deployment get_safe_action density: ceil(height / max(width_x, width_y))
    sphere_stack_z_margin: 0.6
    warmup_steps: 20000

viewer:
  eye: [0., 40., 40.]
  lookat: [0., 2.5, 0.]
  resolution: [960, 720]

wandb:
  project: NavRL
  name: navigation_training
  entity: CERLAB-UAV-RL-Navigation
  mode: offline # online
  run_id: #kw9xf9k9
