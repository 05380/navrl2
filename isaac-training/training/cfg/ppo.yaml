algo:
  feature_extractor:
    learning_rate: 5e-4
    dyn_obs_num: 5
    lidar_history: 5
    lidar_frame_feature_dim: 64
    lidar_temporal_heads: 4
  
  actor:
    learning_rate: 5e-4
    clip_ratio: 0.1
    action_limit: 2.0 # m/s
  
  critic:
    learning_rate: 5e-4
    clip_ratio: 0.1
  
  entropy_loss_coefficient: 1e-3 # encourage exploration
  training_frame_num: 64
  training_epoch_num: 4
  num_minibatches: 16 # split into N minibatches
