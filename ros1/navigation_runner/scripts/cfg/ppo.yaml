algo:
  feature_extractor:
    learning_rate: 5e-4
    dyn_obs_num: 5
    auxiliary:
      enabled: true
      loss_weight: 0.1
      hidden_dim: 128
      future_horizons: [1, 3, 5]
      future_collision_weight: 1.0
      future_stuck_weight: 1.0
      future_clearance_weight: 1.0
      future_progress_weight: 1.0
      future_risk_enabled: true
      future_risk_weight: 1.0
      future_risk_hidden_dim: 128
      future_risk_collision_horizons: [3, 5]
      future_risk_stuck_horizon: 5
      future_risk_deadlock_horizon: 10
  
  actor:
    learning_rate: 5e-4
    clip_ratio: 0.1
    action_limit: 2.0 # m/s
  
  critic:
    learning_rate: 5e-4
    clip_ratio: 0.1
  
  entropy_loss_coefficient: 1e-3 # encourage exploration
  training_frame_num: 32
  training_epoch_num: 4
  num_minibatches: 16 # split into N minibatches
