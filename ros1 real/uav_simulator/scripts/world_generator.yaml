random_seed: 0
map:
  generate_map: True
  save_directory: "default" # same as the world: worlds/generated_env
  # save_directory: "/home/zhefan/catkin_ws/test.pcd"

even_distribution: True

static_objects:
  cylinder: # 2D
    num: 30
    range_x: [-10, 10]
    range_y: [-10, 10]
    radius: [0.2, 0.5] 
    height: [3.0, 4.0] 
  box: # 3D
    num: 30
    range_x: [-10, 10]
    range_y: [-10, 10]
    range_z: [0.0, 0.0]
    width_x: [0.2, 0.5]
    width_y: [0.2, 0.5]
    height: [2.0, 4.0]

# The training map is 40 m x 40 m, while this deployment map is 20 m x 20 m.
# Horizontal wall dimensions are therefore approximately half of the training
# dimensions. Heights are not scaled down so the UAV cannot bypass a wall by
# flying over it within the deployment altitude range.
large_static_structures:
  enabled: True
  range_x: [-9.0, 9.0]
  range_y: [-9.0, 9.0]
  thickness: [0.20, 0.35]
  height: [3.0, 4.0]
  obstacle_clearance: 0.35
  structure_clearance: 0.75
  sampling_attempts: 2000
  pcd_resolution: 0.10
  single_wall:
    num: 1
    length: [2.5, 6.0]
  l_wall:
    num: 1
    arm_length: [4.0, 5.0]
  u_wall:
    num: 1
    width: [5.0, 6.0]
    depth: [1.75, 3.25]

dynamic_objects:
  cylinder: # 2D
    num: 20
    range_x: [-10, 10]
    range_y: [-10, 10]
    radius: [0.2, 0.5] 
    height: [3.0, 4.0] 
    velocity: [0.0, 1.0]
  box: # 3D
    num: 20
    range_x: [-10, 10]
    range_y: [-10, 10]
    range_z: [0, 2]
    width_x: [0.2, 0.5]
    width_y: [0.2, 0.5]
    height: [0.5, 1.5]
    velocity: [0.5, 1.0]
